# Model Configuration
# Defines all models to be tested in the benchmark
# Each provider's recommended daily-use model is selected.

# Closed-source models (4 models)
closed_source:
  - id: anthropic/claude-sonnet-4.6
    name: Claude Sonnet 4.6
    provider: Anthropic
    pricing:
      input: 3.0    # per 1M tokens
      output: 15.0   # per 1M tokens
    reasoning: true
    enabled: true

  - id: openai/gpt-5.4
    name: GPT-5.4
    provider: OpenAI
    pricing:
      input: 2.50
      output: 15.0
    reasoning: true
    enabled: true

  - id: google/gemini-3-flash-preview
    name: Gemini 3 Flash
