# Model Configuration
# Defines all models to be tested in the benchmark
# Each provider's recommended daily-use model is selected.

# Closed-source models (4 models)
closed_source:
  - id: anthropic/claude-sonnet-4.6
    name: Claude Sonnet 4.6
    provider: Anthropic
    pricing:
      input: 3.0    # per 1M tokens
      output: 15.0   # per 1M tokens
    reasoning: true
    enabled: true

  - id: openai/gpt-5.4
    name: GPT-5.4
    provider: OpenAI
    pricing:
      input: 2.50
      output: 15.0
    reasoning: true
    enabled: true

  - id: google/gemini-3-flash-preview
    name: Gemini 3 Flash
    provider: Google
    pricing:
      input: 0.50
      output: 3.0
    reasoning: true
    enabled: true

  # Replaces x-ai/grok-4.1-fast (used in the April 2026 run), which OpenRouter
  # has since removed (checked 2026-11-19). grok-4.20 is the
  # closest release (OpenRouter listing 2026-04-01, versioned id
  # x-ai/grok-4.20-20260309), i.e. already available during the original run.
  # Note: 4.1 Fast was xAI's low-cost tier; 4.20 has no "fast" variant.
  - id: x-ai/grok-4.20
    name: Grok 4.20
    provider: xAI
    pricing:
      input: 1.25
      output: 2.50
    reasoning: true
    enabled: true
    replaces: x-ai/grok-4.1-fast

# Open-source models (7 models)
open_source:
  - id: openai/gpt-oss-120b
    name: GPT-OSS 120B
    provider: OpenAI
    pricing:
      input: 0.04
      output: 0.19
    reasoning: true
    enabled: true

  - id: qwen/qwen3.5-397b-a17b
    name: Qwen3.5 397B
    provider: Alibaba
    region: China
    pricing:
      input: 0.39
      output: 2.34
    reasoning: true
    enabled: true

  - id: moonshotai/kimi-k2.5
    name: Kimi K2.5
    provider: Moonshot
    region: China
    pricing:
      input: 0.42
      output: 2.20
    reasoning: true
    enabled: true

  - id: meta-llama/llama-4-maverick
    name: Llama 4 Maverick
    provider: Meta
    pricing:
      input: 0.15
      output: 0.60
    tool_mode: icl
    reasoning: false
    notes: Native function calling uncertain; using ICL simulation for tool condition
    enabled: true

  - id: deepseek/deepseek-v3.2
    name: DeepSeek V3.2
    provider: DeepSeek
    region: China
    pricing:
      input: 0.26
      output: 0.38
    reasoning: true
    enabled: true

  # Mistral Medium 3.1 (mistral-medium-2508) was deprecated by Mistral on
  # 2026-05-22 and retired on 2026-08-31; OpenRouter still lists it but every request
  # fails ("Invalid model: mistral-medium-2508", checked 2026-11-20). Mistral designates
  # Medium 3.5 as its replacement (docs.mistral.ai/getting-started/models; HF card
  # "replaces its predecessor Mistral Medium 3.1"). Medium 3.5 has open weights (128B
  # dense, modified MIT); with default settings it does not reason (0 reasoning tokens,
  # checked 2026-11-20), like 3.1. Medium 3.5 itself retires 2027-04-30.
  # April prices of the replaced model (for costing old results): 0.40 / 2.00.
  - id: mistralai/mistral-medium-3-5
    name: Mistral Medium 3.5
    provider: Mistral
    region: EU
    pricing:
      input: 1.50
      output: 7.50
    reasoning: false   # default (no reasoning parameter sent)
    enabled: true
    replaces: mistralai/mistral-medium-3.1

  - id: nvidia/nemotron-3-super-120b-a12b
    name: Nemotron 3 Super 120B
    provider: NVIDIA
    pricing:
      input: 0.10
      output: 0.50
    tool_mode: icl
    reasoning: true
    notes: Using ICL simulation for tool condition
    enabled: true

# Local testing model (vLLM)
# Set enabled: true and point host at your vLLM server to use a local model.
local:
  - id: openai/gpt-oss-20b
    name: GPT-OSS 20B
    provider: vLLM
    host: http://localhost:8000/v1
    enabled: false
    notes: Example local model entry — replace id/host with your model

# Judge models for F-category questions (multi-judge panel)
# Using models NOT in the tested set to avoid self-judging bias.
# Judges with `enabled: true` form the panel.
judges:
  - id: anthropic/claude-opus-4.6
    name: Claude Opus 4.6
    provider: Anthropic
    client_type: openrouter
    pricing:
      input: 5.0
      output: 25.0
    enabled: true

  - id: openai/gpt-5.4-pro
    name: GPT-5.4 Pro
    provider: OpenAI
    client_type: openrouter
    pricing:
      input: 30.0
      output: 180.0
    enabled: false  # Expensive — enable after reviewing results

  - id: google/gemini-3.1-pro-preview
    name: Gemini 3.1 Pro
    provider: Google
    client_type: openrouter
    pricing:
      input: 2.0
      output: 12.0
    enabled: true

# Judge panel for the follow-up runs.
# Main model line of each provider, no Pro tier. All three judge every T3 answer
# (scripts/revision/run_judges.py). The `judges` list above is the April panel, kept as a record.
revision_judges:
  - id: anthropic/claude-opus-5.5
    name: Claude Opus 5.5
    provider: anthropic
    temperature: null   # not supported by the model (OpenRouter supported_parameters); not sent
    pricing: {input: 4.0, output: 20.0}
  - id: google/gemini-4-argon
    name: Gemini 4 Argon
    provider: google
    temperature: 0.0    # as in April
    pricing: {input: 2.0, output: 10.0}
  - id: openai/gpt-6.2-sol
    name: GPT-6.2 Sol
    provider: openai
    temperature: null   # not supported by the model (OpenRouter supported_parameters); not sent
    pricing: {input: 2.0, output: 10.0}
